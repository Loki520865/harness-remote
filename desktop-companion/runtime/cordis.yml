# Harness助手 · 桌面伴侣 runtime 组合（Windows）
# stdout 保留给 JSON-RPC 协议：禁止任何 stdout 日志器。
# 参考: examples/jsonrpc-agent/cordis.yml（Linux/bash）+ examples/acp-agent/tests/pwsh.cordis.yml（Windows/pwsh）
#
# sdk-jsonrpc-server 用自写插件（src/jsonrpc-plugin.ts）：createSession 支持
# 跨进程 resume 恢复（磁盘已有持久化日志时恢复上下文，而非官方实现的 id collision）。

# v0.6.4：userQuestions service 提供者。必须挂载在根 ctx（插件 isolate 之间不共享），
# jsonrpc-server 注册桥 provider（提问→手机），dsh-tool-ask-user 消费 ctx.userQuestions.ask()。
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: sdk-jsonrpc-server
  name: '../src/jsonrpc-plugin.ts'
  config:
    maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

# DeepSeek 适配器。模型经 JSON-RPC 按会话下发，此处不固定。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: !!js process.env.DSH_REASONING_EFFORT ?? 'high'

# 子进程托管组（pwsh 执行器的 spawn/kill/输出管道）
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

# Windows 执行器（替代 Linux 的 dsh-bash-local）
- id: bash
  name: '@deepseek-ai/dsh-pwsh-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: shell-env
  name: '@deepseek-ai/dsh-shell-env'

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    # 2026-08-15：开启 skill 能力（agent-spine 自动挂载 skill 注册表 + filesystem provider + tool-skill，
    # 扫描 ~/.dsh/skills —— 手机遥控时模型同样获得技能目录；默认 dshHome=~/.dsh）
    skills:
      enabled: true
    toolBash: false
    # v0.6.4：与 web 端对齐 —— 启用后台任务（toolJobs 默认开，删掉旧显式 false）+ 目标管理（goals）
    goals: {}

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    # 与官方 Web 端（dsh web）共享同一份会话数据：root 由 harness.ts 注入为 ~/.dsh/sessions
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    # 生产 zstd（Web 端默认 zstd，必须一致否则 encodingMismatch）；开发期可设 DSH_SESSION_COMPRESSION=none
    compression: !!js process.env.DSH_SESSION_COMPRESSION ?? 'zstd'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# v0.6.4：手机端 ask_user_question（交互式提问选项卡）。模型侧工具，
# 消费 ctx.userQuestions service（本文件顶部 user-questions 提供）。
# jsonrpc-server 注册桥 provider：提问转发到手机渲染，手机答案经 user/answer 方法回填。
# App 端必须 ≥0.6.4 才能渲染选项卡并提交答案。
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# ─────────────────────────────────────────────────────────────────────────────
# v0.6.4：web 端工具对齐（dsh-base bundle 对照补挂，让手机会话与电脑端无缝衔接）
# 配置与官方 dsh-base 一致，仅裁剪 web/UI 专属项（settings/credentials/telemetry/plan-mode 等）。
# ─────────────────────────────────────────────────────────────────────────────

# 联网搜索（web_search 工具）：searchProvider=deepseek-official，复用 DEEPSEEK_API_KEY
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# 全库文件搜索（fs_search）：session-query 精确读 + SQLite 内容搜索（openAt: never = 仅按标题/工作区检索）
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: ':memory:'
    openAt: never

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# 子代理 fork（复用历史上下文的只发一次子代理）+ 控制工具（list_agents/send_message/interrupt_agent）
- id: subagent-fork-in-process
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent-report
  name: '@deepseek-ai/dsh-tool-subagent-report'

# workflow 工作流（后台子代理编排）
- id: workflow-worker-thread
  name: '@deepseek-ai/dsh-workflow-worker-thread'
  config:
    provider: spawn

- id: tool-workflow
  name: '@deepseek-ai/dsh-tool-workflow'

# 字符串替换编辑器（str_replace_editor，大文件精准改）
- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

# 工具链连续重复提醒（repeat_tool_reminder）
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  config:
    thresholds: [3, 5, 8]
    argumentsPreviewChars: 500

# 大输出 spill（超长工具结果落盘引用）+ 工具结果压缩器
- id: spill-local
  name: '@deepseek-ai/dsh-spill-local'

- id: spill-policy
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    maxInlineBytes: 50000

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

# 工具调用超时策略
- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'
